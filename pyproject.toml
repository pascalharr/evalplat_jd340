[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pascalharr-evalplat_jd340"
version = "0.1.0"
description = "按结构键把条目聚类，标出模型评测平台工程师·合成数据的质量分水岭上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pascalharr" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pascalharr.github.io"
Repository = "https://github.com/pascalharr/evalplat_jd340"
Issues = "https://github.com/pascalharr/evalplat_jd340/issues"

[project.scripts]
evalplat_jd340 = "evalplat_jd340:main"

[tool.setuptools]
py-modules = ["evalplat_jd340"]
